<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32" role="img" aria-label="oheco">
  <title>oheco</title>
  <!-- The two o's of "oo" glued together: the rings cross just off the
       centerline so the mark reads as an infinity sign. The header in
       index.html inlines the same two circles; scripts/test-site.cjs keeps
       both copies in sync. -->
  <style>
    .mark { fill: none; stroke: #192a32; stroke-width: 4.5 }
    @media (prefers-color-scheme: dark) { .mark { stroke: #f2f5f2 } }
  </style>
  <g class="mark">
    <circle cx="14.25" cy="16" r="10"/>
    <circle cx="33.75" cy="16" r="10"/>
  </g>
</svg>
