name: Validate and publish packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: oheco/oheco
          # Schema-v5 generator including the prompted installer; legacy
          # indexes remain fail-closed. Bump this together with
          # oheco/scripts/install.sh.tmpl or the site keeps the old installer.
          ref: f5dab8131fa6cac67d5bb051aff22ef195d4d701
          path: .tools/oheco
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Validate descriptors and published artifacts
        env:
          OHECO_SOURCE: ${{ github.workspace }}/.tools/oheco
        run: sh scripts/build.sh --verify-artifacts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
